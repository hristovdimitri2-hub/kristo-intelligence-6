stages:
  - test

run_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  script:
    - pytest -ra --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

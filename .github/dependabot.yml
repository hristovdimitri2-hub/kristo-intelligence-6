# Dependency updates, weekly.
#
# The repository had no dependency automation, so a security release in Flask,
# web3, cryptography or stripe was invisible until someone happened to look.
# `cryptography` signs the CDP JWT at runtime and `web3` moves the money, so a
# CVE in either is not a housekeeping item.
#
# PRs only, and grouped: one reviewable PR per ecosystem rather than a stream of
# single-package ones nobody reads.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/packages/x402-client"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

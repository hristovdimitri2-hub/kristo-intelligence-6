name: CI

# WHY THIS EXISTS
# The repository had no pipeline at all, so nothing checked a change before it
# reached the live service — the only gate was running the suite by hand on one
# machine. Three jobs: the suite, a scan for credentials being committed, and the
# owner's language rule.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    # PINNED, not `ubuntu-latest`: GitHub announced that `latest` migrates to
    # Ubuntu 26 in October 2026, and a runner image change should be a commit we
    # make on purpose, not something that happens under a green build.
    runs-on: ubuntu-24.04
    steps:
      # v7 targets Node.js 24. v4/v5 targeted Node 20, which is deprecated, so
      # every run carried a warning nobody could act on.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # `requirements-dev.txt` builds on requirements.txt, so this installs the
      # same runtime set the deploy does, plus pytest. The deploy file itself no
      # longer carries a test runner.
      #
      # The output is TEED to a file so the next step can turn each failure into
      # an annotation. Without it a failed run is a bare "Process completed with
      # exit code 1" and nothing else: the job log needs admin rights on the
      # repository, so a public-API reader (or an agent working on the repo)
      # cannot see which test failed. That cost two rounds of guessing on
      # 20.11.2026 — runs #84 and the run on 179e738 both failed with no test
      # name anywhere readable, and the second one had a docs-only diff.
      #
      # `set -o pipefail` is load-bearing: without it the pipeline's exit status
      # is `tee`'s, which is always 0, and a failing suite would report success.
      - name: Run the suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.log

      - name: Annotate failed tests
        if: failure()
        run: |
          found=0
          while IFS= read -r line; do
            echo "::error::${line}"
            found=1
          done < <(grep -E '^(FAILED|ERROR) ' pytest-output.log || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::the suite failed but printed no FAILED/ERROR line — read the job log"
            tail -n 40 pytest-output.log
          fi

      # Kept even when the suite passes: a green run whose log nobody can read
      # is one bad day away from being an unreadable red run.
      - name: Upload the suite output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest-output.log
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan (working tree)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `--no-git` on purpose: this gate is "do not COMMIT a credential", not
      # "audit every commit ever made". The history is known to contain older
      # material and rewriting it is a separate, destructive decision the owner
      # has not taken — a job that failed on day one and could not be fixed
      # without a force-push would be noise, not a signal. Once the history is
      # clean, drop `--no-git` and this becomes the full audit.
      - name: Scan the working tree for committed credentials
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --no-git --redact --verbose --exit-code 1

  language:
    name: Document language (English)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The owner's rule: every document in the repository is English, because a
      # second language in the tree is how code gets misread. Reports TO him stay
      # Bulgarian — the rule is about what is committed.
      #
      # This ran only by hand until 24.11.2026, and the rule quietly broke: the
      # radar is a Bulgarian generator, so it restored `docs/AP2_RADAR.md` within
      # one run of the translation commit and nothing noticed for weeks. The
      # generator is a report to the owner, so that one file is a named exception
      # inside the script (OWNER_FACING_GENERATED); everything else fails here.
      - name: Every tracked document is English
        run: |
          set -o pipefail
          python3 scripts/doc_language_audit.py 2>&1 | tee lang-output.log

      # Same reasoning as the suite job: the log needs admin rights, so the
      # failure itself has to carry the file names.
      - name: Annotate the documents that are not English
        if: failure()
        run: |
          found=0
          while IFS= read -r line; do
            echo "::error::not English: ${line}"
            found=1
          done < <(grep -E '^ *[0-9]+ +.*\.md$' lang-output.log || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::the language audit failed without naming a file — read the job log"
            tail -n 40 lang-output.log
          fi
